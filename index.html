<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="填色">
<meta name="theme-color" content="#1C1F1E">
<meta name="description" content="ANCHI99 線上填色本試用版：手繪線稿，點一下填色，也可以用 Apple Pencil 塗。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>填色 · 試用版｜ANCHI99</title>
<style>
:root{
  --paper:#FBF8F1;--ink:#1B1815;
  --celadon:#3F5E57;--gold:#B9924F;
  --chrome:#1C1F1E;--chrome-2:#2A2F2D;--chrome-3:#3B423F;
  --chrome-text:#E9EEEB;--chrome-dim:#95A39D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chrome:#141716;--chrome-2:#1F2422}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--chrome);color:var(--chrome-text);
  font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;display:flex;flex-direction:column;
}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid #000}
.brand{font-size:14px;letter-spacing:.16em;color:var(--chrome-dim);margin-right:4px;white-space:nowrap}
.spacer{flex:1}
button{font:inherit;color:var(--chrome-text);background:var(--chrome-2);border:1px solid transparent;border-radius:10px;min-height:40px;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}
button:active{background:var(--chrome-3)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--celadon);color:#fff}
button.icon{min-width:42px;padding:0 9px;font-size:16px}
button:disabled{opacity:.35}
.pick{display:flex;gap:3px;background:var(--chrome-2);border-radius:10px;padding:3px}
.pick button{background:transparent;min-width:38px;min-height:34px;padding:0;font-size:14px}
.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#262C2A 0%,#101413 100%);padding:10px;touch-action:none}
.sheet{position:relative;transform-origin:0 0;will-change:transform;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff;border-radius:2px;overflow:hidden}
.sheet canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#paint{z-index:1}
#line{z-index:2;pointer-events:none}
#hit{z-index:3;touch-action:none;background:transparent}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(20,23,22,.92);color:var(--chrome-dim);font-size:13px;padding:8px 14px;border-radius:999px;z-index:5;pointer-events:none;transition:opacity .4s;max-width:90%;text-align:center;opacity:0}
.tools{flex:0 0 auto;background:var(--chrome);border-top:1px solid #000;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.toolrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.toolrow .spacer{flex:1}
.toolrow:last-child{margin-bottom:0}
.groups{display:flex;gap:6px}
.groups button{min-width:46px;min-height:38px;padding:0 8px}
.swatches{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.grp{display:flex;align-items:center;gap:5px;flex:0 0 auto;padding-right:10px;margin-right:4px;border-right:1px solid var(--chrome-3)}
.grp:last-child{border-right:0}
.grp .lab{font-size:11px;color:var(--chrome-dim);letter-spacing:.1em;width:14px;text-align:center}
.sw{width:38px;height:38px;border-radius:8px;border:2px solid transparent;flex:0 0 auto;padding:0;min-height:0}
.sw[aria-pressed="true"]{border-color:#fff;transform:scale(1.08)}
input[type=range]{flex:1;accent-color:var(--celadon);min-height:30px}
.lab2{font-size:13px;color:var(--chrome-dim);white-space:nowrap}
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:20px}
.modal.on{display:flex}
.modal-card{background:var(--chrome-2);border-radius:16px;padding:22px;max-width:420px;width:100%;max-height:88vh;overflow:auto}
.modal-card p{margin:0 0 14px;font-size:15px;line-height:1.75}
.modal-card h2{margin:0 0 10px;font-size:18px;letter-spacing:.1em}
.modal-card ol{margin:0 0 16px;padding-left:1.3em;font-size:14.5px;line-height:1.9}
.modal-card .acts{display:flex;gap:8px;justify-content:flex-end}
#imgOut{width:100%;height:auto;border-radius:8px;margin-bottom:14px;background:#fff;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#shareBtn{display:block;width:100%;background:var(--celadon);color:#fff;font-weight:600;margin-bottom:10px;min-height:48px}
#openLink,#saveLink{display:block;text-align:center;text-decoration:none;background:var(--chrome-3);color:var(--chrome-text);border-radius:10px;padding:13px;margin-bottom:10px}
.foot{font-size:11.5px;color:var(--chrome-dim);text-align:center;margin:12px 0 0}
@media (max-width:700px){.brand{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <span class="brand">填色</span>
  <div class="pick">
    <button data-art="1" aria-pressed="true">圖一</button>
    <button data-art="2">圖二</button>
    <button data-art="3">圖三</button>
  </div>
  <div class="spacer"></div>
  <button class="icon" id="undo" aria-label="復原">↺</button>
  <button class="icon" id="clear">清空</button>
  <button id="save">存圖</button>
</header>

<main class="stage" id="stage">
  <div class="sheet" id="sheet">
    <canvas id="paint"></canvas>
    <canvas id="line"></canvas>
    <canvas id="hit"></canvas>
  </div>
  <div class="hint" id="hint"></div>
</main>

<div class="tools">
  <div class="toolrow">
    <button id="mFill" aria-pressed="true">填色</button>
    <button id="mBrush">筆刷</button>
    <button id="mBlend">混色</button>
    <button id="mErase">橡皮</button>
    <span class="lab2" id="szLab">粗細</span>
    <input type="range" id="size" min="4" max="60" step="2" value="18">
    <button id="penonly" aria-pressed="false">手指可畫</button>
  </div>
  <div class="toolrow">
    <div class="groups" id="grp"></div>
    <span class="spacer"></span>
    <button class="icon" id="zoomOut" aria-label="縮小">－</button>
    <span class="lab2" id="zoomLab">100%</span>
    <button class="icon" id="zoomIn" aria-label="放大">＋</button>
    <button id="zoomReset">重設</button>
  </div>
  <div class="toolrow">
    <div class="swatches" id="sw"></div>
  </div>
</div>

<div class="modal" id="welcome">
  <div class="modal-card">
    <h2>填色 · 試用版</h2>
    <p>三張手繪線稿，試試看順不順手。</p>
    <ol>
      <li>選一個顏色，點畫面上的空白處就填滿</li>
      <li>換成「筆刷」可以自己塗，Apple Pencil 有壓力感應</li>
      <li>兩指撐開放大、轉動可以旋轉畫面，手怎麼順就怎麼擺</li>
      <li>不滿意按左上角的 ↺ 退回上一步</li>
    </ol>
    <div class="acts"><button id="welcomeGo">開始</button></div>
  </div>
</div>

<div class="modal" id="imgModal">
  <div class="modal-card">
    <p id="imgTip"></p>
    <img id="imgOut" alt="填好的圖">
    <button id="shareBtn">儲存到檔案或相簿</button>
    <a id="openLink" target="_blank" rel="noopener">在新分頁開啟</a>
    <a id="saveLink" download>直接下載到電腦</a>
    <div class="acts"><button id="imgClose">關閉</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const stage=$("#stage"),sheet=$("#sheet");
const pc=$("#paint"),lc=$("#line"),hc=$("#hit");
const pctx=pc.getContext("2d",{willReadFrequently:true});
const lctx=lc.getContext("2d");

/* 五行配色，每一行八階。之後要接日主推薦，改這一份就好。 */
const PALETTE={
 "木":["#1F4A2B","#2F6B3A","#4A8C4F","#6FA85F","#93C07A","#B7D49C","#D7E8C4","#EEF5E2"],
 "火":["#6E1B14","#9E2E24","#C24631","#D9603F","#E8915E","#F0B183","#F7D2B2","#FBE8D8"],
 "土":["#4E3A1C","#7A5B2E","#9E7A3C","#B9924F","#CFA968","#DEC48D","#EBDAB2","#F5EBD6"],
 "金":["#6B4A10","#8F6511","#B8860B","#D9A520","#F0C04A","#FBD87A","#FDE9AE","#FEF6DC"],
 "水":["#10233C","#1F3D61","#2E5980","#3E6E96","#5C8CB0","#7FA6C4","#A9C4DA","#CFE0EC"],
 "墨":["#000000","#2B2B2B","#555555","#808080","#AAAAAA","#D5D5D5","#F2F2F2","#FFFFFF"]
};
let color="#4A8C4F",group="木",mode="fill",brush=18,penOnly=false;
let art=1,iw=0,ih=0,wall=null,snapshots=[],pdata=null;

/* ---------- 調色盤 ---------- */
function drawSwatches(){
  const box=$("#sw");box.innerHTML="";
  for(const c of PALETTE[group]){
    const b=document.createElement("button");
    b.className="sw";b.style.background=c;b.dataset.c=c;
    b.setAttribute("aria-label",group+" "+c);
    b.setAttribute("aria-pressed",c===color?"true":"false");
    b.onclick=()=>{
      color=c;drawSwatches();
      if(mode==="erase")setMode("fill");
    };
    box.appendChild(b);
  }
}
(function buildGroups(){
  const box=$("#grp");
  for(const name in PALETTE){
    const b=document.createElement("button");
    b.textContent=name;b.dataset.g=name;
    b.setAttribute("aria-pressed",name===group?"true":"false");
    b.onclick=()=>{
      group=name;
      document.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.g===name?"true":"false"));
      drawSwatches();
    };
    box.appendChild(b);
  }
  drawSwatches();
})();

/* ---------- 載入線稿 ---------- */
function loadArt(n){
  art=n;
  document.querySelectorAll("[data-art]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.art===String(n)?"true":"false"));
  const img=new Image();
  img.onload=()=>{
    iw=img.naturalWidth;ih=img.naturalHeight;
    for(const c of [pc,lc,hc]){c.width=iw;c.height=ih;}
    // 讀出線稿，做出「牆」的遮罩，並把白底變透明留下線條
    const t=document.createElement("canvas");t.width=iw;t.height=ih;
    const tc=t.getContext("2d",{willReadFrequently:true});
    tc.drawImage(img,0,0);
    const d=tc.getImageData(0,0,iw,ih);
    const a=d.data;
    wall=new Uint8Array(iw*ih);
    for(let i=0,p=0;i<a.length;i+=4,p++){
      const lum=(a[i]*299+a[i+1]*587+a[i+2]*114)/1000;
      if(lum<140)wall[p]=1;
      a[i]=a[i+1]=a[i+2]=20;
      a[i+3]=255-lum;           // 越黑越不透明
    }
    lctx.clearRect(0,0,iw,ih);
    lctx.putImageData(d,0,0);
    pctx.fillStyle="#FFFFFF";pctx.fillRect(0,0,iw,ih);
    snapshots=[];pdata=null;
    restore();
    fit();resetView();
    updateUndo();
  };
  img.onerror=()=>toast("線稿載不進來，檢查檔案有沒有上傳完整");
  img.src="art"+n+".png";
}
function fit(){
  const aw=stage.clientWidth-20,ah=stage.clientHeight-20;
  const s=Math.min(aw/iw,ah/ih);
  sheet.style.width=Math.floor(iw*s)+"px";
  sheet.style.height=Math.floor(ih*s)+"px";
}

/* ---------- 記錄與復原 ---------- */
function snap(){
  try{
    snapshots.push(pctx.getImageData(0,0,iw,ih));
    if(snapshots.length>8)snapshots.shift();
  }catch(e){}
  updateUndo();
}
function updateUndo(){$("#undo").disabled=snapshots.length===0;}
$("#undo").onclick=()=>{
  const s=snapshots.pop();
  if(s){pctx.putImageData(s,0,0);pdata=null;save();}
  updateUndo();
};
$("#clear").onclick=()=>{
  snap();
  pctx.fillStyle="#FFFFFF";pctx.fillRect(0,0,iw,ih);
  pdata=null;save();
};

/* ---------- 填色 ---------- */
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function fillAt(x,y,hex){
  if(x<0||y<0||x>=iw||y>=ih)return;
  if(wall[y*iw+x])return;
  if(!pdata)pdata=pctx.getImageData(0,0,iw,ih);
  const u32=new Uint32Array(pdata.data.buffer);
  const [r,g,b]=hexRGB(hex);
  const fill=(255<<24)|(b<<16)|(g<<8)|r;
  const start=u32[y*iw+x];
  if(start===fill)return;
  const stack=[x,y];
  while(stack.length){
    const sy=stack.pop(),sx0=stack.pop();
    let sx=sx0,i=sy*iw+sx;
    while(sx>=0&&!wall[i]&&u32[i]===start){sx--;i--;}
    sx++;i++;
    let up=false,dn=false;
    while(sx<iw&&!wall[i]&&u32[i]===start){
      u32[i]=fill;
      if(sy>0){const k=i-iw,c=!wall[k]&&u32[k]===start;
        if(!up&&c){stack.push(sx,sy-1);up=true;}else if(up&&!c)up=false;}
      if(sy<ih-1){const k=i+iw,c=!wall[k]&&u32[k]===start;
        if(!dn&&c){stack.push(sx,sy+1);dn=true;}else if(dn&&!c)dn=false;}
      sx++;i++;
    }
  }
  pctx.putImageData(pdata,0,0);
}

/* ---------- 縮放、平移、旋轉：兩指縮放、拖移、轉動；單指或筆照常畫 ---------- */
let zs=1,zx=0,zy=0,rot=0;
const pointers=new Map();
let gesture=null;
function applyView(){
  sheet.style.transform="translate("+zx+"px,"+zy+"px) rotate("+rot+"rad) scale("+zs+")";
  const deg=Math.round(rot*180/Math.PI)%360;
  $("#zoomLab").textContent=Math.round(zs*100)+"%"+(deg?" · "+deg+"°":"");
}
function resetView(){zs=1;zx=0;zy=0;rot=0;applyView();}
// 把螢幕上的點換算回線稿上的位置，旋轉和縮放都要倒推回去
function localOf(cx,cy){
  const r=stage.getBoundingClientRect();
  const x=(cx-r.left)-sheet.offsetLeft-zx;
  const y=(cy-r.top)-sheet.offsetTop-zy;
  const c=Math.cos(-rot),si=Math.sin(-rot);
  return [(x*c-y*si)/zs,(x*si+y*c)/zs];
}
function anchorTo(mx,my,local,s2,r2){
  const r=stage.getBoundingClientRect();
  const c=Math.cos(r2),si=Math.sin(r2);
  const px=s2*local[0],py=s2*local[1];
  zx=(mx-r.left)-sheet.offsetLeft-(px*c-py*si);
  zy=(my-r.top)-sheet.offsetTop-(px*si+py*c);
  zs=s2;rot=r2;
}
function zoomBy(f){
  const local=[sheet.clientWidth/2,sheet.clientHeight/2];
  const r=stage.getBoundingClientRect();
  const c=Math.cos(rot),si=Math.sin(rot);
  const px=zs*local[0],py=zs*local[1];
  const mx=r.left+sheet.offsetLeft+zx+(px*c-py*si);
  const my=r.top+sheet.offsetTop+zy+(px*si+py*c);
  anchorTo(mx,my,local,Math.max(1,Math.min(8,zs*f)),rot);
  applyView();
}
$("#zoomIn").onclick=()=>zoomBy(1.4);
$("#zoomOut").onclick=()=>zoomBy(1/1.4);
$("#zoomReset").onclick=resetView;

function startGesture(){
  const pts=[...pointers.values()];
  const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
  const mx=(pts[0].x+pts[1].x)/2,my=(pts[0].y+pts[1].y)/2;
  gesture={d0:Math.hypot(dx,dy)||1,a0:Math.atan2(dy,dx),s0:zs,r0:rot,local:localOf(mx,my)};
}
function moveGesture(){
  if(!gesture)return;
  const pts=[...pointers.values()];
  if(pts.length<2)return;
  const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
  const mx=(pts[0].x+pts[1].x)/2,my=(pts[0].y+pts[1].y)/2;
  const d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);
  const s2=Math.max(1,Math.min(8,gesture.s0*(d/gesture.d0)));
  let r2=gesture.r0+(a-gesture.a0);
  // 轉到快正的時候自動歸正，比較好擺回原位
  const deg=((r2*180/Math.PI)%360+360)%360;
  if(Math.min(deg,360-deg)<4)r2=Math.round(r2/(Math.PI*2))*Math.PI*2;
  anchorTo(mx,my,gesture.local,s2,r2);
  applyView();
}

/* ---------- 筆刷 ---------- */
let act=null;
function toXY(e){
  const l=localOf(e.clientX,e.clientY);
  const kx=iw/(sheet.clientWidth||iw),ky=ih/(sheet.clientHeight||ih);
  return [Math.round(l[0]*kx),Math.round(l[1]*ky)];
}
function accepted(e){return penOnly?e.pointerType==="pen":true;}
function stroke(a,b,press){
  pctx.save();
  pctx.globalCompositeOperation="source-over";
  pctx.strokeStyle=mode==="erase"?"#FFFFFF":color;
  pctx.lineCap="round";pctx.lineJoin="round";
  const shown=(sheet.clientWidth||iw)*zs;
  pctx.lineWidth=brush*(iw/shown)*(0.4+1.0*press);
  pctx.beginPath();pctx.moveTo(a[0],a[1]);pctx.lineTo(b[0],b[1]);pctx.stroke();
  pctx.restore();
  pdata=null;
}
// 混色筆：一邊畫一邊讀下面已經有的顏色，跟筆上的顏色揉在一起，
// 疊得越久顏色推得越開，像油畫刀把兩色抹在一起。
let carry=null;
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function sampleAt(x,y){
  const px=Math.max(0,Math.min(iw-1,Math.round(x))),py=Math.max(0,Math.min(ih-1,Math.round(y)));
  try{const d=pctx.getImageData(px,py,1,1).data;return [d[0],d[1],d[2]];}catch(e){return [255,255,255];}
}
function strokeBlend(a,b,press){
  const s0=sampleAt(b[0],b[1]);
  if(!carry)carry=s0.slice();
  carry=mix(carry,s0,0.45);
  const c=mix(carry,hexRGB(color),0.28+0.34*press);
  pctx.save();
  pctx.globalAlpha=0.10+0.26*press;
  pctx.strokeStyle="rgb("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+")";
  pctx.lineCap="round";pctx.lineJoin="round";
  const shown=(sheet.clientWidth||iw)*zs;
  pctx.lineWidth=brush*(iw/shown)*(0.6+0.9*press);
  pctx.beginPath();pctx.moveTo(a[0],a[1]);pctx.lineTo(b[0],b[1]);pctx.stroke();
  pctx.restore();
  pdata=null;
}
function pressure(e){let p=e.pressure;if(e.pointerType!=="pen"||!p)p=.6;return Math.max(.08,Math.min(1,p));}

hc.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
hc.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  if(pointers.size>=2){          // 兩指以上 = 縮放平移，不要畫
    act=null;startGesture();e.preventDefault();return;
  }
  if(!accepted(e))return;
  e.preventDefault();hideHint();
  const p=toXY(e);
  if(mode==="fill"){snap();fillAt(p[0],p[1],color);save();return;}
  snap();
  carry=null;
  act={id:e.pointerId,last:p};
  if(mode==="blend")strokeBlend(p,p,pressure(e));
  else stroke(p,p,pressure(e));
},{passive:false});

window.addEventListener("pointermove",e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  if(pointers.size>=2){if(e.cancelable)e.preventDefault();moveGesture();return;}
  if(!act||e.pointerId!==act.id)return;
  if(e.cancelable)e.preventDefault();
  if(mode==="blend"){                 // 混色要讀畫布，一次一點就好，不然會拖慢
    const p=toXY(e);strokeBlend(act.last,p,pressure(e));act.last=p;return;
  }
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){const p=toXY(ev);stroke(act.last,p,pressure(ev));act.last=p;}
},{passive:false});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)gesture=null;
  if(act&&e.pointerId===act.id){act=null;carry=null;save();}
}
window.addEventListener("pointerup",endPointer);
window.addEventListener("pointercancel",endPointer);

/* ---------- 模式 ---------- */
function setMode(m){
  mode=m;
  $("#mFill").setAttribute("aria-pressed",m==="fill");
  $("#mBrush").setAttribute("aria-pressed",m==="brush");
  $("#mBlend").setAttribute("aria-pressed",m==="blend");
  $("#mErase").setAttribute("aria-pressed",m==="erase");
}
$("#mFill").onclick=()=>setMode("fill");
$("#mBrush").onclick=()=>setMode("brush");
$("#mBlend").onclick=()=>setMode("blend");
$("#mErase").onclick=()=>setMode("erase");
$("#size").oninput=e=>{brush=+e.target.value;};
$("#penonly").onclick=()=>{
  penOnly=!penOnly;
  $("#penonly").setAttribute("aria-pressed",penOnly?"true":"false");
  $("#penonly").textContent=penOnly?"只接受筆":"手指可畫";
};

/* ---------- 存檔 ---------- */
const KEY="colorbook.v1";
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(KEY+".art"+art,pc.toDataURL("image/png"));}
    catch(e){toast("塗得太多，這台裝置存不下了。先存成圖片再清空。",6000);}
  },900);
}
function restore(){
  try{
    const d=localStorage.getItem(KEY+".art"+art);
    if(!d)return;
    const im=new Image();
    im.onload=()=>{pctx.drawImage(im,0,0);pdata=null;};
    im.src=d;
  }catch(e){}
}

let blobURL=null,pendingFile=null;
function deliver(filename,blob,previewSrc,tip,mime){
  if(blobURL)URL.revokeObjectURL(blobURL);
  blobURL=URL.createObjectURL(blob);
  try{pendingFile=new File([blob],filename,{type:mime});}catch(e){pendingFile=null;}
  const a=$("#saveLink");a.href=blobURL;a.download=filename;
  const o=$("#openLink");o.href=blobURL;
  const canShare=!!(pendingFile&&navigator.canShare&&navigator.canShare({files:[pendingFile]}));
  $("#shareBtn").style.display=canShare?"block":"none";
  o.style.display=canShare?"none":"block";
  a.style.display=canShare?"none":"block";
  const img=$("#imgOut");
  if(previewSrc){img.src=previewSrc;img.style.display="block";}else{img.style.display="none";}
  $("#imgTip").textContent=tip;
  $("#imgModal").classList.add("on");
}
$("#imgClose").onclick=()=>{$("#imgModal").classList.remove("on");if(blobURL){URL.revokeObjectURL(blobURL);blobURL=null;}pendingFile=null;};
$("#shareBtn").onclick=async()=>{
  if(!pendingFile)return;
  try{await navigator.share({files:[pendingFile]});}
  catch(e){if(e&&e.name!=="AbortError")toast("系統擋下了這次儲存，改用「在新分頁開啟」再從分享鍵存檔");}
};
$("#save").onclick=async()=>{
  const c=document.createElement("canvas");c.width=iw;c.height=ih;
  const x=c.getContext("2d");
  x.fillStyle="#FFFFFF";x.fillRect(0,0,iw,ih);
  x.drawImage(pc,0,0);x.drawImage(lc,0,0);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  if(!blob){toast("圖片做不出來");return;}
  deliver("填色-圖"+art+".png",blob,c.toDataURL("image/png"),
    "按下面的按鈕，選「儲存影像」存到相簿，或「儲存到檔案」。","image/png");
};

/* ---------- 其他 ---------- */
let hintTimer=null;
function hideHint(){$("#hint").style.opacity="0";}
function toast(m,ms){const h=$("#hint");h.textContent=m;h.style.opacity="1";clearTimeout(hintTimer);hintTimer=setTimeout(hideHint,ms||3600);}
document.querySelectorAll("[data-art]").forEach(b=>{
  b.onclick=()=>{if(+b.dataset.art!==art)loadArt(+b.dataset.art);};
});
$("#welcomeGo").onclick=()=>{
  $("#welcome").classList.remove("on");
  try{localStorage.setItem(KEY+".seen","1");}catch(e){}
};
let rz=null;
window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{fit();resetView();},150);});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

let seen=false;
try{seen=!!localStorage.getItem(KEY+".seen");}catch(e){}
if(!seen)$("#welcome").classList.add("on");
loadArt(1);
if(seen)setTimeout(()=>toast("選個顏色，點空白處就填滿",4500),400);

})();
</script>
